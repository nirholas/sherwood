[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 1000
via_ir = true
fs_permissions = [{ access = "read", path = "./test/deps" }]

[fmt]
line_length = 120

[lint]
# Timestamps are load-bearing here: interest, grace windows and corporate-action effective times are
# all wall-clock quantities. Robinhood Chain is an Orbit rollup with a single sequencer, so there is
# no validator to shop timestamps, and every window in this protocol is minutes or longer.
exclude_lints = ["block-timestamp"]
